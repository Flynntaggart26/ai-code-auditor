name: code-audit
on: [push, pull_request]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python auditor.py . --no-ai --json report.json
      - run: python -m pytest tests/ -q
      - uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: report.json
